name: Docker CI

# Build-and-smoke-test only; the image is never pushed from here. Docker Hub
# pushes happen in release.yml, from v* tags only.

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-ci.yml'
  # On demand, from any branch. Nothing is published here.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest

    env:
      BUILD_NUMBER: ${{ format('{0}-{1}-{2}', github.run_id, github.run_number, github.run_attempt) }}
      IMAGE_TAG: ci-build  # throwaway, never pushed

    steps:
      - uses: actions/checkout@v5
      - name: Read version
        run: echo "RELEASE=$(tr -d '[:space:]' < docker/VERSION)" >> "$GITHUB_ENV"
      - name: Build image
        run: >-
          docker build docker
          --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          --build-arg BUILD_NUMBER=$BUILD_NUMBER
          --build-arg RELEASE=$RELEASE
          --build-arg VERSION=${{ github.sha }}
          -t "$IMAGE_TAG"
      - name: Smoke test
        run: |
          out="$(docker run --rm "$IMAGE_TAG" "$GITHUB_REPOSITORY_OWNER")"
          echo "$out"
          echo "$out" | grep -qx "Hello, ${GITHUB_REPOSITORY_OWNER}!"
          echo "$out" | grep -qF "release $RELEASE"

  notify:
    name: Announce the green build
    needs: build
    uses: ./.github/workflows/notify.yml
    with:
      kind: ci
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_CI }}
