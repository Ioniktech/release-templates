name: Python CI

# Build-and-test only; nothing is published here. PyPI uploads happen in
# release.yml, from v* tags only.

on:
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-dist
          path: python/dist/

  notify:
    name: Announce the green build
    needs: [test, build]

    # Pushes to main only: a notification per pull-request run would bury the
    # channel. No `if: success()` either -- a skipped job is already the policy.
    if: github.event_name == 'push'

    uses: ./.github/workflows/notify.yml
    with:
      kind: ci
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_CI }}
