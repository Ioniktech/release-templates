name: Release

# One tag releases every technology in this repo. `v1.2.3` must match the
# version declared by each example, or the release fails before anything is
# published -- see the `check` job.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  check:
    name: Check tag matches versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Compare tag against every example
        run: |
          tag="${GITHUB_REF_NAME#v}"
          status=0

          # python/src/hello_world/version.py holds: __version__ = '0.1.0'
          python_version="$(cut -d "'" -f 2 python/src/hello_world/version.py)"
          if [ "$tag" != "$python_version" ]; then
            echo "::error file=python/src/hello_world/version.py::tag ${GITHUB_REF_NAME} does not match python version (${python_version})"
            status=1
          fi

          docker_version="$(tr -d '[:space:]' < docker/VERSION)"
          if [ "$tag" != "$docker_version" ]; then
            echo "::error file=docker/VERSION::tag ${GITHUB_REF_NAME} does not match docker version (${docker_version})"
            status=1
          fi

          [ "$status" -eq 0 ] || exit 1
          echo "Releasing ${tag}"

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: check

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  test-docker:
    name: Test Docker
    runs-on: ubuntu-latest
    needs: check

    env:
      IMAGE_TAG: release-test  # throwaway, never pushed

    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build docker --build-arg RELEASE="${GITHUB_REF_NAME#v}" -t "$IMAGE_TAG"
      - name: Smoke test
        run: docker run --rm "$IMAGE_TAG" | grep -qx 'Hello, world!'

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [check, test-python]

    # Trusted Publishing: PyPI authenticates this workflow over OIDC, no token.
    # The environment is what gates the upload on a manual approval.
    environment: pypi
    permissions:
      id-token: write

    outputs:
      package: ${{ steps.meta.outputs.package }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Read package metadata
        id: meta
        working-directory: python
        # pyproject.toml already names the distribution and the console script,
        # so nothing downstream repeats either literal.
        run: |
          python -c "import pathlib, tomllib; p = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']; print('package=' + p['name']); print('script=' + next(iter(p['scripts'])))" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
      - name: Verify install from PyPI
        env:
          PACKAGE: ${{ steps.meta.outputs.package }}
          SCRIPT: ${{ steps.meta.outputs.script }}
        run: |
          sleep 60  # give PyPI's CDN a moment to serve the new release
          python -m pip install --upgrade "${PACKAGE}==${GITHUB_REF_NAME#v}"
          test "$("$SCRIPT" --version)" = "${GITHUB_REF_NAME#v}"
          "$SCRIPT" "$GITHUB_REPOSITORY_OWNER"

  publish-dockerhub:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: [check, test-docker]

    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are secrets on this environment,
    # which is also what gates the push on a manual approval.
    # DOCKERHUB_NAMESPACE is an environment variable (the Docker Hub org/user).
    environment: dockerhub

    outputs:
      image: ${{ steps.meta.outputs.image }}

    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      BUILD_NUMBER: ${{ format('{0}-{1}-{2}', github.run_id, github.run_number, github.run_attempt) }}

    steps:
      - uses: actions/checkout@v7
      - name: Read version and image name
        id: meta
        # The OCI title in docker/Dockerfile is the image name, so the
        # repository to push to is derived rather than spelled out here.
        run: |
          image="$(sed -n 's/.*org\.opencontainers\.image\.title="\([^"]*\)".*/\1/p' docker/Dockerfile)"
          [ -n "$image" ] || { echo "::error file=docker/Dockerfile::no org.opencontainers.image.title label"; exit 1; }
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "IMAGE_NAME=${NAMESPACE}/${image}"
            echo "RELEASE=$(tr -d '[:space:]' < docker/VERSION)"
            echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_NUMBER=${{ env.BUILD_NUMBER }}
            RELEASE=${{ env.RELEASE }}
            VERSION=${{ github.sha }}
      - name: Verify pull from Docker Hub
        run: docker run --rm "$IMAGE_NAME:$RELEASE" | grep -qF "release $RELEASE"

  notify:
    name: Announce the release
    needs: [publish-pypi, publish-dockerhub]

    # No `if:` on purpose. A job whose `needs` did not all succeed is skipped,
    # so a release that failed to publish announces nothing.
    #
    # These secrets are read outside the pypi/dockerhub environments, so they
    # belong to the repository, not to an environment.
    uses: ./.github/workflows/notify.yml
    with:
      kind: release
      tag: ${{ github.ref_name }}
      pypi-package: ${{ needs.publish-pypi.outputs.package }}
      docker-image: ${{ needs.publish-dockerhub.outputs.image }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_RELEASE }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
